<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        /* CSS Variables */
        :root {
            --green-dark: #2d5016;
            --green: #22c55e;
            --gold: #d4af37;
            --gold-light: #ffd700;
            --danger: #ef4444;
            --border: #e2e8f0;
            --text-primary: #1f2937;
            --text-muted: #6b7280;
            --bg-white: #ffffff;
            --bg-light: #f8fafc;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --radius: 0.5rem;
            --orange: #f97316;
            --blue: #3b82f6;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f3e6 50%, #fff8dc 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
        }

        /* Container */
        .container {
            max-width: 50rem;
            margin: 0 auto;
            background: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--green-dark) 0%, #4a7c59 100%);
            color: var(--gold-light);
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        /* Stats */
        .stats {
            display: flex;
            padding: 1rem 2rem;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
        }

        .stat {
            flex: 1;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--green-dark);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Main */
        main {
            padding: 2rem;
        }

        /* Form - Updated for compact layout */
        .form-container {
            background: linear-gradient(135deg, #f8fdf8 0%, #fffef7 100%);
            border: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .input-row {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .main-input-group {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .secondary-input-group {
            flex: 1;
            display: flex;
            gap: 0.5rem;
        }

        .button-group {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-start;
        }

        input[type="text"], input[type="date"], textarea {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
            border-color: var(--green);
        }

        textarea {
            min-height: 60px;
            resize: vertical;
            font-size: 0.875rem;
        }

        input[type="date"] {
            min-width: 140px;
        }

        /* Buttons */
        button {
            padding: 1rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--green-dark);
            height: fit-content;
            white-space: nowrap;
        }

        .btn-success {
            background: var(--green);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-export {
            background: #10b981;
            color: white;
            margin-bottom: 1rem;
        }

        /* Task List */
        .task-list {
            list-style: none;
            margin-bottom: 2rem;
        }

        .task-item {
            background: var(--bg-white);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }

        .task-item:hover {
            transform: translateY(-2px);
            border-color: var(--green);
        }

        .task-item.completed {
            background: #f0fdf4;
            border-color: var(--green);
        }

        .task-item.overdue {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .task-item.due-soon {
            border-color: var(--orange);
            background: #fff7ed;
        }

        .task-item.editing {
            border-color: var(--blue);
            background: #eff6ff;
        }

        .task-header {
            display: flex;
            align-items: center;
            padding: 1rem;
            gap: 1rem;
        }

        .task-checkbox {
            width: 1.5rem;
            height: 1.5rem;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1.1rem;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-edit-input {
            display: none;
            width: 100%;
            padding: 0.5rem;
            border: 2px solid var(--green);
            border-radius: var(--radius);
            font-size: 1.1rem;
        }

        .task-item.editing .task-text {
            display: none;
        }

        .task-item.editing .task-edit-input {
            display: block;
        }

        .task-date {
            display: inline-block;
            background: var(--blue);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .task-date.overdue {
            background: var(--danger);
        }

        .task-date.due-soon {
            background: var(--orange);
        }

        .task-date.completed {
            background: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .task-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        /* Edit mode specific button styling */
        .task-item:not(.editing) .save-btn,
        .task-item:not(.editing) .cancel-btn {
            display: none !important;
        }

        .task-item.editing .edit-btn {
            display: none !important;
        }

        .task-notes {
            display: none;
            padding: 0 1rem 1rem;
        }

        .task-notes.visible {
            display: block;
        }

        .task-notes-content {
            background: #fffef7;
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--gold);
            margin-bottom: 0.5rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state.hidden {
            display: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            background: var(--bg-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .input-row {
                flex-direction: column;
                gap: 1rem;
            }
            
            .main-input-group, .secondary-input-group, .button-group {
                flex: 1;
            }
            
            .secondary-input-group {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .task-header {
                flex-wrap: wrap;
            }
            
            .stats {
                flex-direction: column;
                gap: 1rem;
            }

            .btn-primary {
                width: 100%;
            }

            .task-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
		
            <h1>My To-Do</h1>
           
        </header>
        
        <div class="stats">
            <div class="stat">
                <span class="stat-number" id="total-tasks">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="completed-tasks">0</span>
                <span class="stat-label">Completed</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="remaining-tasks">0</span>
                <span class="stat-label">Remaining</span>
            </div>
        </div>
        
        <main>
            <form id="task-form">
                <div class="form-container">
                    <div class="input-row">
                        <div class="main-input-group">
                            <input 
                                type="text" 
                                id="task-input" 
                                placeholder="What needs to be accomplished today?" 
                                required
                            >
                            <textarea 
                                id="notes-input" 
                                placeholder="Add notes (optional)..."
                            ></textarea>
                        </div>
                        <div class="secondary-input-group">
                            <input 
                                type="date" 
                                id="date-input" 
                                title="Optional due date"
                            >
                        </div>
                        <div class="button-group">
                            <button type="submit" class="btn-primary">✨ Add Task</button>
                        </div>
                    </div>
                </div>
            </form>
            
            <button class="btn-export" onclick="exportToExcel()">📊 Export to Excel</button>
            
            <div class="empty-state" id="empty-state">
                <h2>🌱</h2>
                <p>Your task garden is empty</p>
                <p>Plant your first task above!</p>
            </div>
            
            <ul class="task-list" id="task-list"></ul>
            
            <button class="btn-danger" id="clear-all" style="width: 100%;">🗑️ Clear All Tasks</button>
        </main>
        
        <footer>
            <p>Your tasks are saved locally ✨</p>
        </footer>
    </div>

    <script>
        // Task Manager
        let tasks = [];

        // Load tasks on startup
        function loadTasks() {
            const saved = JSON.parse(localStorage.getItem('tasks') || '[]');
            tasks = saved;
            renderTasks();
        }

        // Save tasks
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Add task
        function addTask(e) {
            e.preventDefault();
            const text = document.getElementById('task-input').value.trim();
            const notes = document.getElementById('notes-input').value.trim();
            const date = document.getElementById('date-input').value;
            
            if (!text) return;
            
            const task = {
                id: Date.now(),
                text: text,
                notes: notes,
                date: date,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            tasks.push(task);
            saveTasks();
            renderTasks();
            
            document.getElementById('task-input').value = '';
            document.getElementById('notes-input').value = '';
            document.getElementById('date-input').value = '';
        }

        // Toggle task completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        // Delete task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        // Edit task
        function editTask(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            item.classList.add('editing');
            const input = item.querySelector('.task-edit-input');
            input.focus();
            input.select(); // Select all text for easy editing
        }

        // Save edit
        function saveEdit(id) {
            const item = document.querySelector(`[data-id="${id}"]`);
            const newText = item.querySelector('.task-edit-input').value.trim();
            
            if (newText) {
                const task = tasks.find(t => t.id === id);
                task.text = newText;
                saveTasks();
                renderTasks();
            } else {
                // If empty, just cancel the edit
                cancelEdit(id);
            }
        }

        // Cancel edit
        function cancelEdit(id) {
            renderTasks();
        }

        // Toggle notes visibility
        function toggleNotes(id) {
            const notes = document.querySelector(`[data-id="${id}"] .task-notes`);
            notes.classList.toggle('visible');
        }

        // Clear all tasks
        function clearAll() {
            if (confirm('Are you sure you want to delete all tasks?')) {
                tasks = [];
                saveTasks();
                renderTasks();
            }
        }

        // Get date status
        function getDateStatus(dateStr, completed) {
            if (!dateStr || completed) return null;
            
            const taskDate = new Date(dateStr);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            // Reset time to compare just dates
            today.setHours(0, 0, 0, 0);
            tomorrow.setHours(0, 0, 0, 0);
            taskDate.setHours(0, 0, 0, 0);
            
            if (taskDate < today) return 'overdue';
            if (taskDate.getTime() === today.getTime() || taskDate.getTime() === tomorrow.getTime()) return 'due-soon';
            return 'upcoming';
        }

        // Format date for display
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric',
                year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
            });
        }

        // Export to Excel
        function exportToExcel() {
            if (tasks.length === 0) {
                alert('No tasks to export!');
                return;
            }

            // Create CSV content
            let csv = 'Task,Due Date,Notes,Status,Created Date\n';
            
            tasks.forEach(task => {
                const status = task.completed ? 'Completed' : 'Pending';
                const createdDate = new Date(task.createdAt).toLocaleDateString();
                const dueDate = task.date ? new Date(task.date).toLocaleDateString() : '';
                // Escape commas and quotes in text
                const taskText = `"${task.text.replace(/"/g, '""')}"`;
                const taskNotes = `"${(task.notes || '').replace(/"/g, '""')}"`;
                csv += `${taskText},${dueDate},${taskNotes},${status},${createdDate}\n`;
            });

            // Create blob and download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `todo_list_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Render tasks
        function renderTasks() {
            const list = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            
            list.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                // Sort tasks: incomplete with dates first, then incomplete without dates, then completed
                const sortedTasks = [...tasks].sort((a, b) => {
                    if (a.completed !== b.completed) {
                        return a.completed ? 1 : -1;
                    }
                    if (!a.completed && !b.completed) {
                        if (a.date && !b.date) return -1;
                        if (!a.date && b.date) return 1;
                        if (a.date && b.date) return new Date(a.date) - new Date(b.date);
                    }
                    return 0;
                });
                
                sortedTasks.forEach(task => {
                    const li = document.createElement('li');
                    const dateStatus = getDateStatus(task.date, task.completed);
                    let className = `task-item ${task.completed ? 'completed' : ''}`;
                    
                    if (dateStatus === 'overdue') className += ' overdue';
                    else if (dateStatus === 'due-soon') className += ' due-soon';
                    
                    li.className = className;
                    li.dataset.id = task.id;
                    
                    const dateDisplay = task.date ? `
                        <span class="task-date ${task.completed ? 'completed' : dateStatus || ''}">
                            ${formatDate(task.date)}
                        </span>
                    ` : '';
                    
                    li.innerHTML = `
                        <div class="task-header">
                            <input 
                                type="checkbox" 
                                class="task-checkbox" 
                                ${task.completed ? 'checked' : ''} 
                                onchange="toggleTask(${task.id})"
                            >
                            <div class="task-content">
                                <div class="task-text">${escapeHtml(task.text)}${dateDisplay}</div>
                                <input 
                                    type="text" 
                                    class="task-edit-input" 
                                    value="${escapeHtml(task.text)}"
                                    onkeydown="if(event.key==='Enter') saveEdit(${task.id}); if(event.key==='Escape') cancelEdit(${task.id});"
                                >
                            </div>
                            <div class="task-actions">
                                <button class="btn-success edit-btn" onclick="editTask(${task.id})">✏️ Edit</button>
                                <button class="btn-success save-btn" onclick="saveEdit(${task.id})">💾 Save</button>
                                <button class="btn-secondary cancel-btn" onclick="cancelEdit(${task.id})">❌ Cancel</button>
                                ${task.notes ? `<button class="btn-secondary" onclick="toggleNotes(${task.id})">📝 Notes</button>` : ''}
                                <button class="btn-danger" onclick="deleteTask(${task.id})">🗑️ Delete</button>
                            </div>
                        </div>
                        ${task.notes ? `
                            <div class="task-notes">
                                <div class="task-notes-content">${escapeHtml(task.notes)}</div>
                            </div>
                        ` : ''}
                    `;
                    
                    list.appendChild(li);
                });
            }
            
            updateStats();
        }

        // Update statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const remaining = total - completed;
            
            document.getElementById('total-tasks').textContent = total;
            document.getElementById('completed-tasks').textContent = completed;
            document.getElementById('remaining-tasks').textContent = remaining;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        document.getElementById('task-form').addEventListener('submit', addTask);
        document.getElementById('clear-all').addEventListener('click', clearAll);

        // Load tasks on page load
        loadTasks();
    </script>
</body>
</html>
